<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم جامع رزرو و مدیریت نوبت | سالن زیبایی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0f0f0f; color: #f3f4f6; }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%); }
        .gold-border { border-color: #d4af37; }
        .gold-text { color: #d4af37; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-lg mx-auto">

    <header class="text-center py-6 border-b gold-border mb-6">
        <span class="text-xs bg-zinc-800 gold-text px-3 py-1 rounded-full border gold-border">سیستم هوشمند نوبت‌دهی</span>
        <h1 class="text-2xl font-bold gold-text tracking-wider mt-3">سالن زیبایی لوکس</h1>
        <p class="text-xs text-gray-400 mt-1">رزرو آنلاین خدمات تخصصی زیبایی بانوان</p>
    </header>

    <main class="space-y-5 flex-1 bg-zinc-950 p-5 rounded-2xl border border-zinc-800 shadow-xl">
        <div>
            <label class="block text-xs font-semibold mb-2 text-gray-300">انتخاب خدمت:</label>
            <select id="serviceSelect" class="w-full bg-zinc-900 border gold-border rounded-xl p-3 text-sm focus:outline-none">
                <option value="براشینگ و استایل مو - ۲۵۰,۰۰۰ تومان">براشینگ و استایل مو (۲۵۰,۰۰۰ تومان)</option>
                <option value="رنگ و لایت تخصصی - ۱,۲۰۰,۰۰۰ تومان">رنگ و لایت تخصصی (۱,۲۰۰,۰۰۰ تومان)</option>
                <option value="میکاپ و گریم عروس - ۳,۵۰۰,۰۰۰ تومان">میکاپ و گریم عروس (۳,۵۰۰,۰۰۰ تومان)</option>
                <option value="کاشت و ترمیم ناخن - ۴۰۰,۰۰۰ تومان">کاشت و ترمیم ناخن (۴۰۰,۰۰۰ تومان)</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-semibold mb-2 text-gray-300">تاریخ مراجعه:</label>
                <input type="date" id="dateInput" class="w-full bg-zinc-900 border gold-border rounded-xl p-3 text-sm focus:outline-none text-right">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-2 text-gray-300">ساعت نوبت:</label>
                <select id="timeSelect" class="w-full bg-zinc-900 border gold-border rounded-xl p-3 text-sm focus:outline-none">
                    <option value="۱۰:۰۰ صبح">۱۰:۰۰ صبح</option>
                    <option value="۱۲:۰۰ ظهر">۱۲:۰۰ ظهر</option>
                    <option value="۱۵:۰۰ عصر">۱۵:۰۰ عصر</option>
                    <option value="۱۷:۰۰ عصر">۱۷:۰۰ عصر</option>
                </select>
            </div>
        </div>

        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold mb-2 text-gray-300">نام و نام خانوادگی مشتری:</label>
                <input type="text" id="clientName" placeholder="مثال: سارا سعادتی" class="w-full bg-zinc-900 border gold-border rounded-xl p-3 text-sm focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-2 text-gray-300">شماره تماس (جهت هماهنگی):</label>
                <input type="tel" id="clientPhone" placeholder="0912..." class="w-full bg-zinc-900 border gold-border rounded-xl p-3 text-sm focus:outline-none text-left">
            </div>
        </div>

        <button onclick="submitBooking()" class="w-full gold-gradient text-black font-bold py-3.5 rounded-xl shadow-lg transition-transform active:scale-95 cursor-pointer">
            ثبت نهایی و انتقال به مدیریت سالن
        </button>

        <div id="successMsg" class="hidden text-center bg-zinc-900 border border-green-500 text-green-400 p-4 rounded-xl text-sm">
            ✅ نوبت شما با موفقیت در سیستم ثبت شد و اطلاعات به مدیر سالن ارسال گردید.
        </div>
    </main>

    <footer class="text-center py-5 text-xs text-gray-400 border-t border-zinc-800 mt-6 space-y-2">
        <p>توسعه یافته توسط استارتاپ فناورانه هوش مصنوعی <span class="gold-text font-bold">رویال فام</span></p>
        <p class="text-gray-500">پشتیبانی فنی: <span dir="ltr">09366681963</span> | <span dir="ltr">amirsamyaghobi62@gmail.com</span></p>
    </footer>

    <script>
        function submitBooking() {
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const date = document.getElementById('dateInput').value;

            if(!name || !phone || !date) {
                alert('لطفاً تمامی فیلدها (نام، شماره تماس و تاریخ) را به دقت پر کنید.');
                return;
            }
            document.getElementById('successMsg').classList.remove('hidden');
        }
    </script>
</body>
</html>
